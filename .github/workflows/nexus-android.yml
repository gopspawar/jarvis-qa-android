name: Build NEXUS APK
on:
  workflow_dispatch:
  pull_request:
    paths: ["nexus-android/**", ".github/workflows/nexus-android.yml"]
  push:
    branches: [nexus-android-apk]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-installable-APK
          path: nexus-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
